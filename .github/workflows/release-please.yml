name: Release Please

on:
  workflow_call:
    outputs:
      release_created:
        value: ${{ jobs.release-please.outputs.release_created }}
      tag:
        value: ${{ jobs.release-please.outputs.tag }}
      sha:
        value: ${{ jobs.release-please.outputs.sha }}

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071
        id: release
        with:
          # A PR opened with the default GITHUB_TOKEN triggers no workflows: the
          # runs sit at `action_required` with zero jobs, so a "release PR must
          # be green" gate was structurally unreachable. A PAT makes the PR an
          # ordinary user PR and its checks run on their own. Until that secret
          # exists this falls back to GITHUB_TOKEN and behaves as before.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
