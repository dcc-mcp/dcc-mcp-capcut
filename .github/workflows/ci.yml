name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.9"
          - os: windows-2022
            python: "3.12"
          - os: macos-14
            python: "3.13"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Doctor preflight smoke
        shell: bash
        run: |
          set +e
          python -m dcc_mcp_capcut.doctor --json > doctor-report.json
          status=$?
          set -e
          python - <<'PY'
          import json
          import pathlib

          report = json.loads(pathlib.Path("doctor-report.json").read_text())
          assert report["checks"], "doctor emitted no checks"
          for check in report["checks"]:
              assert check["status"] in {"ok", "warn", "fail", "skip"}, check
          PY
          echo "doctor exit code: $status"
          test "$status" -le 1
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check .

  package:
    name: Python package and panel artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and check Python distributions
        run: |
          python -m pip install --disable-pip-version-check build twine
          python -m build
          python -m twine check dist/*
      - name: Build deterministic panel artifact
        run: python tools/build_panel_archive.py --version 0.1.0 --output dist/dcc-mcp-capcut-0.1.0-panel.zip
      - name: Verify the panel artifact against its manifest
        run: python tools/build_panel_archive.py --verify dist/dcc-mcp-capcut-0.1.0-panel.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  core-floor:
    name: dcc-mcp-core ${{ matrix.core }} (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The declared floor is unverified by design: this job exists to produce the
    # evidence, not to gate the merge. Once a floor entry is green it must be
    # promoted to experimental: false so a regression fails the build.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: "0.20.21"
            label: CI-verified
            experimental: false
          - core: "0.19.45"
            label: lowest installable 0.19.x
            experimental: true
          - core: "0.19.13"
            label: floor as declared in pyproject.toml
            experimental: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - name: Resolve the pin
        id: pin
        shell: bash
        run: |
          printf 'dcc-mcp-core==%s\n' "${{ matrix.core }}" > "$RUNNER_TEMP/core-pin.txt"
          if python -m pip install --disable-pip-version-check --dry-run \
              -c "$RUNNER_TEMP/core-pin.txt" 'dcc-mcp-core'; then
            echo "resolvable=true" >> "$GITHUB_OUTPUT"
          else
            echo "resolvable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::dcc-mcp-core==${{ matrix.core }} cannot be resolved from PyPI; the declared floor may not exist."
          fi
      - name: Install
        id: install
        if: steps.pin.outputs.resolvable == 'true'
        run: |
          python -m pip install --disable-pip-version-check -c "$RUNNER_TEMP/core-pin.txt" -e ".[dev]"
          python -c "import importlib.metadata as m; print('dcc-mcp-core', m.version('dcc_mcp_core'))"
      - name: Test
        id: test
        # Only meaningful on an environment that actually installed the pin; a
        # skipped or failed install must not be read as a test result.
        if: steps.install.outcome == 'success'
        run: python -m pytest -q
      - name: Record the floor verdict
        if: always()
        shell: bash
        run: |
          resolvable="${{ steps.pin.outputs.resolvable }}"
          install="${{ steps.install.outcome }}"
          suite="${{ steps.test.outcome }}"
          # Keep the three failure modes apart: a version that does not exist on
          # PyPI is a different fact from one this runner cannot install, and
          # only the third says the adapter itself is broken on that version.
          if [[ "$resolvable" == "false" ]]; then
            verdict="NOT RESOLVABLE (no such version on PyPI)"
          elif [[ "$install" == "failure" ]]; then
            verdict="NOT INSTALLABLE (dependency or platform conflict)"
          elif [[ "$suite" == "success" ]]; then
            verdict="USABLE"
          elif [[ "$suite" == "failure" ]]; then
            verdict="NOT USABLE"
          else
            verdict="NOT RUN (resolvable=$resolvable install=$install test=$suite)"
          fi
          {
            echo "### dcc-mcp-core ${{ matrix.core }} — $verdict"
            echo ""
            echo "- Label: ${{ matrix.label }}"
            echo "- Resolution: \`resolvable=$resolvable\`"
            echo "- Install step: \`$install\`"
            echo "- Test suite: \`$suite\`"
            echo "- Gate: $([[ "${{ matrix.experimental }}" == "true" ]] && echo 'reported only (continue-on-error)' || echo 'blocking')"
            echo "- Declared floor in \`pyproject.toml\`: \`dcc-mcp-core>=0.19.13,<1.0.0>\`"
            echo ""
            echo "A \`NOT USABLE\` verdict on a floor entry is the evidence to raise"
            echo "the declared floor; it must not be silenced by relaxing this job. A"
            echo "\`NOT INSTALLABLE\` verdict means this runner could not install the"
            echo "pin and says nothing about adapter compatibility with it."
          } >> "$GITHUB_STEP_SUMMARY"

  skill-contract:
    name: Bundled Skill contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate every bundled skill
        shell: bash
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/dcc-mcp-cli.zip" \
            https://github.com/dcc-mcp/dcc-mcp-core/releases/download/v0.20.21/dcc-mcp-cli-0.20.21-linux-x86_64.zip
          echo "ada852953c71df7682dc9a3d5ddabf351d421d58d00ed1ee40acb63b49949afe  $RUNNER_TEMP/dcc-mcp-cli.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/dcc-mcp-cli.zip" -d "$RUNNER_TEMP/dcc-mcp-cli"
          for skill in src/dcc_mcp_capcut/skills/capcut-*; do
            "$RUNNER_TEMP/dcc-mcp-cli/dcc-mcp-cli" lint "$skill" --warnings-as-errors --output json
          done

  demo-contract:
    name: Vlog recipe contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - run: python demo/validate_recipe.py demo/vlog_recipe.json
