name: Native Qt probe
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            host: windows
            arch: win64_msvc2019_64
            qt_dir: msvc2019_64
            fixture: Release/probe_fixture.exe
          - os: ubuntu-22.04
            host: linux
            arch: gcc_64
            qt_dir: gcc_64
            fixture: probe_fixture
          - os: macos-15-intel
            host: mac
            arch: clang_64
            qt_dir: macos
            fixture: probe_fixture
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install aqtinstall==3.3.0 -e .
      - name: Fetch matching Qt SDK
        run: python -m aqt install-qt ${{ matrix.host }} desktop 6.2.2 ${{ matrix.arch }} -O qt --archives qtbase
      - name: Configure
        run: cmake -S native/qt-probe -B build/qt-probe -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ github.workspace }}/qt/6.2.2/${{ matrix.qt_dir }}"
      - name: Build
        run: cmake --build build/qt-probe --config Release
      - name: Stage plugin
        run: cmake --install build/qt-probe --config Release --prefix build/qt-probe/stage
      - name: Exercise actual plugin
        shell: bash
        run: |
          export PATH="$PWD/qt/6.2.2/${{ matrix.qt_dir }}/bin:$PATH"
          python tools/test_qt_probe_native.py "build/qt-probe/${{ matrix.fixture }}" build/qt-probe/stage
