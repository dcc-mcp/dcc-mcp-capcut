name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release-please:
    uses: ./.github/workflows/release-please.yml
    permissions:
      contents: write
      pull-requests: write

  artifacts:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
      RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate exact release identity
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = "dcc-mcp/dcc-mcp-capcut"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$RELEASE_SHA" = "$GITHUB_SHA"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Build release artifacts
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          python -m pip install --disable-pip-version-check build twine
          python -m build
          python -m twine check dist/*
          python tools/build_panel_archive.py \
            --version "$version" \
            --output "dist/dcc-mcp-capcut-${version}-panel.zip"
          python tools/build_panel_archive.py \
            --verify "dist/dcc-mcp-capcut-${version}-panel.zip"
          find dist -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Attach artifacts to Release Please release
        shell: bash
        run: |
          mapfile -d '' artifacts < <(find dist -maxdepth 1 -type f -print0 | sort -z)
          gh release upload "$RELEASE_TAG" "${artifacts[@]}" SHA256SUMS
