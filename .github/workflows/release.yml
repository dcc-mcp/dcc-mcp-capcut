name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release-please:
    uses: ./.github/workflows/release-please.yml
    permissions:
      contents: write
      pull-requests: write

  artifacts:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
      RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate exact release identity
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = "dcc-mcp/dcc-mcp-capcut"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$RELEASE_SHA" = "$GITHUB_SHA"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Check the tree agrees with the release tag
        shell: bash
        # The wheel takes its version from pyproject.toml and the panel archive
        # from the tag, so nothing compared the two chains. Fail here, before
        # anything is built, when the tree never followed the tag.
        run: python tools/check_release_version.py --expect "${RELEASE_TAG#v}"
      - name: Build release artifacts
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          python -m pip install --disable-pip-version-check build twine
          python -m build
          python -m twine check dist/*
          python tools/build_panel_archive.py \
            --version "$version" \
            --output "dist/dcc-mcp-capcut-${version}-panel.zip"
          python tools/build_panel_archive.py \
            --verify "dist/dcc-mcp-capcut-${version}-panel.zip"
      - name: Check every artifact declares the release version
        shell: bash
        # Judge what was built, not what the tree claims: read the version back
        # out of each artifact, and upload nothing unless they all agree.
        run: python tools/check_release_version.py --expect "${RELEASE_TAG#v}" --dist dist
      - name: Checksum the artifacts
        shell: bash
        run: find dist -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Attach artifacts to Release Please release
        shell: bash
        run: |
          mapfile -d '' artifacts < <(find dist -maxdepth 1 -type f -print0 | sort -z)
          gh release upload "$RELEASE_TAG" "${artifacts[@]}" SHA256SUMS

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [release-please, artifacts]
    if: needs.release-please.outputs.release_created == 'true'
    environment:
      name: pypi
      url: https://pypi.org/p/dcc-mcp-capcut
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release identity and version
        env:
          EXPECTED_VERSION: ${{ needs.release-please.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release target must be a canonical vMAJOR.MINOR.PATCH tag." >&2
            exit 1
          }
          export EXPECTED_VERSION="${RELEASE_TAG#v}"
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          expected = os.environ["EXPECTED_VERSION"]
          manifest = json.loads(Path(".release-please-manifest.json").read_text(encoding="utf-8"))["."]
          source = Path("pyproject.toml").read_text(encoding="utf-8")
          match = re.search(r'^version = "([0-9]+\.[0-9]+\.[0-9]+)"', source, re.MULTILINE)
          if match is None or manifest != expected or match.group(1) != expected:
              raise SystemExit("Checked-out package version does not match the release target.")
          PY

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build package
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          verbose: true
          print-hash: true
