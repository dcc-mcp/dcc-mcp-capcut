tools:
  - name: add_audio
    description: Add an audio asset to the timeline with optional beat alignment.
    input_schema: {type: object, required: [media_id, start], properties: {media_id: {type: string}, timeline_id: {type: string}, start: {type: number, minimum: 0}, source_in: {type: number, minimum: 0}, source_out: {type: number, minimum: 0}, beat_sync: {type: boolean, default: false}}}
    read_only: false
    destructive: true
    idempotent: false
    execution: sync
    affinity: any
    source_file: scripts/add_audio.py
  - name: set_audio_volume
    description: Set clip volume and optional keyframe envelope.
    input_schema: {type: object, required: [clip_id, volume], properties: {clip_id: {type: string}, volume: {type: number, minimum: 0, maximum: 4}, keyframes: {type: array}}}
    read_only: false
    destructive: true
    idempotent: true
    execution: sync
    affinity: any
    source_file: scripts/set_audio_volume.py
  - name: add_audio_fade
    description: Add linear fade in/out to an audio clip.
    input_schema: {type: object, required: [clip_id], properties: {clip_id: {type: string}, fade_in: {type: number, minimum: 0}, fade_out: {type: number, minimum: 0}}}
    read_only: false
    destructive: true
    idempotent: true
    execution: sync
    affinity: any
    source_file: scripts/add_audio_fade.py
  - name: remove_audio
    description: Remove an audio clip from the timeline.
    input_schema: {type: object, required: [clip_id], properties: {clip_id: {type: string}}}
    read_only: false
    destructive: true
    idempotent: false
    execution: sync
    affinity: any
    source_file: scripts/remove_audio.py
