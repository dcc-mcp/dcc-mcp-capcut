[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dcc-mcp-capcut"
version = "0.1.0"
description = "Typed MCP adapter and bridge for CapCut Desktop editing workflows"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "loonghao", email = "hal.long@outlook.com" }]
dependencies = [
  "dcc-mcp-core>=0.19.13,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/dcc-mcp/dcc-mcp-capcut"
Repository = "https://github.com/dcc-mcp/dcc-mcp-capcut"
Issues = "https://github.com/dcc-mcp/dcc-mcp-capcut/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "build>=1.2", "pyyaml>=6", "opentimelineio>=0.16,<1"]
interchange = ["opentimelineio>=0.16,<1"]

[project.entry-points."dcc_mcp.adapters"]
capcut = "dcc_mcp_capcut:CapCutMcpServer"

[project.scripts]
dcc-mcp-capcut = "dcc_mcp_capcut.bootstrap:main"
dcc-mcp-capcut-runtime = "dcc_mcp_capcut.runtime_entry:main"
dcc-mcp-capcut-doctor = "dcc_mcp_capcut.doctor:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dcc_mcp_capcut"]
artifacts = ["src/dcc_mcp_capcut/skills/**", "src/dcc_mcp_capcut/capcut_panel/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
