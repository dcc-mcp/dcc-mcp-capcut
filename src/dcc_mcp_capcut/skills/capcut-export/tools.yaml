tools:
  - name: export_video
    description: Export the active timeline to a video file with explicit codec settings. Set verify_output to require a probed export receipt (size, duration, streams) instead of a bare acknowledgement.
    input_schema: {type: object, required: [output_path], properties: {output_path: {type: string}, timeline_id: {type: string}, format: {type: string, enum: [mp4, mov]}, codec: {type: string, enum: [h264, h265, prores]}, width: {type: integer}, height: {type: integer}, fps: {type: number}, bitrate_mbps: {type: number}, audio: {type: boolean, default: true}, verify_output: {type: boolean, default: false, description: "Opt in to the full export receipt: the host must probe the artifact and return size, duration and stream info under verification.output."}}}
    read_only: false
    destructive: true
    idempotent: true
    execution: async
    affinity: any
    timeout_hint_secs: 600
    source_file: scripts/export_video.py
  - name: get_export_status
    description: Read progress for an export job, and output validation when the caller opts in with verify_output.
    input_schema: {type: object, required: [job_id], properties: {job_id: {type: string}, verify_output: {type: boolean, default: false, description: "Opt in to the full export receipt: the host must probe the artifact and return size, duration and stream info under verification.output."}}}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: any
    source_file: scripts/get_export_status.py
  - name: cancel_export
    description: Cancel a running export job.
    input_schema: {type: object, required: [job_id], properties: {job_id: {type: string}}}
    read_only: false
    destructive: true
    idempotent: true
    execution: sync
    affinity: any
    source_file: scripts/cancel_export.py
  - name: export_thumbnail
    description: Export a still frame thumbnail from the active timeline. Set verify_output to require a probed still-image receipt (size, dimensions, stream).
    input_schema: {type: object, required: [output_path], properties: {output_path: {type: string}, time: {type: number, minimum: 0}, format: {type: string, enum: [png, jpg]}, verify_output: {type: boolean, default: false, description: "Opt in to the full export receipt: the host must probe the still and return size, dimensions and stream info under verification.output."}}}
    read_only: false
    destructive: true
    idempotent: true
    execution: sync
    affinity: any
    source_file: scripts/export_thumbnail.py
  - name: build_vlog_demo
    description: Build a complete short-form Vlog from supplied royalty-free media, captions, music, and export settings. Set verify_output to require a probed export receipt for the rendered file.
    input_schema: {type: object, required: [media], properties: {project_name: {type: string, default: Free Travel Vlog}, media: {type: array, items: {type: object}}, music: {type: object}, captions: {type: array}, output_path: {type: string}, aspect_ratio: {type: string, enum: [9:16, 16:9, 1:1]}, verify_output: {type: boolean, default: false, description: "Opt in to the full export receipt: the host must probe the artifact and return size, duration and stream info under verification.output."}}}
    read_only: false
    destructive: true
    idempotent: false
    execution: async
    affinity: any
    timeout_hint_secs: 900
    source_file: scripts/build_vlog_demo.py
